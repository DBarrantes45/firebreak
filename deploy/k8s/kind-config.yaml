# Local cluster for phase 10. Create it with:
#   source deploy/k8s/env.sh
#   kind create cluster --name firebreak --config deploy/k8s/kind-config.yaml
#
# Kubernetes 1.37 matches the current CKA curriculum. The node image is pinned
# by digest, as listed in the kind v0.33.0 release notes.
#
# No extraPortMappings: kubectl port-forward is enough for a lab started per
# session, and port mappings can only change by recreating the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
