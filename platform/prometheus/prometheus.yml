global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Generated by Sloth from slos/; regenerate instead of editing.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: orders-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Metrics pushed over OTLP by the Collector (needs --web.enable-otlp-receiver).
otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id

storage:
  tsdb:
    # Pushed samples can arrive late; without this window they are dropped.
    out_of_order_time_window: 30m
