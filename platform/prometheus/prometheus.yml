global:
  scrape_interval: 15s
  evaluation_interval: 15s

# slo-*.yml is generated by Sloth from slos/; regenerate instead of editing.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: orders-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The extension point: every file in targets/ adds services to scrape, and
  # Prometheus picks up new or edited files without a restart. See
  # docs/monitor-your-own-service.md.
  - job_name: services
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
    relabel_configs:
      # Each service becomes its own job, so up{job="<service>"} and the
      # dashboards read naturally.
      - source_labels: [service]
        target_label: job
      # Marks where the target came from, for the ServiceDown alert.
      - target_label: discovered_from
        replacement: targets

# Metrics pushed over OTLP by the Collector (needs --web.enable-otlp-receiver).
otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id

storage:
  tsdb:
    # Pushed samples can arrive late; without this window they are dropped.
    out_of_order_time_window: 30m
    # Measured at ~65 samples/s (~900 series): about 250 MB for 30 days. The
    # size cap is for the homelab, where more targets could fill a disk long
    # before 30 days; whichever limit hits first wins. Here, not in the
    # deprecated --storage.tsdb.retention.* flags, so a reload applies it.
    retention:
      time: 30d
      size: 2GB
