apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Log line -> trace in Tempo. With matcherType "label", matcherRegex is
      # the field name (trace_id lives in structured metadata).
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          # $$ stops provisioning from expanding it as an environment variable.
          url: "$${__value.raw}"
          urlDisplayLabel: "Open trace in Tempo"
          datasourceUid: tempo
