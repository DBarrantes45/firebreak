apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uids: dashboards and the other data sources link by uid.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Exemplar -> trace in Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
