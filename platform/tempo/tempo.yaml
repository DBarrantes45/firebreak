# Based on the official single-binary example (Tempo 3).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Traces are the heaviest signal: ~195 MB stored already under the 14-day
# default. A week is enough to debug recent requests. Tempo 3 moved this from
# compactor.compaction to backend_worker; the old path fails at startup.
backend_worker:
  compaction:
    block_retention: 168h

usage_report:
  reporting_enabled: false
