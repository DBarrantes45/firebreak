# Based on the official loki-local-config.yaml (Loki 3).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

limits_config:
  # OTLP logs carry trace_id and friends as structured metadata; Loki rejects
  # them without this (default since 3.0, kept explicit on purpose).
  allow_structured_metadata: true
  # Loki keeps logs forever unless told otherwise. Two weeks covers looking
  # back at an incident; changing it later doesn't touch logs already stored.
  retention_period: 336h

# The compactor is what actually deletes expired logs (it needs the 24h index
# period set below).
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
