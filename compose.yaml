name: firebreak

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init-env.sh first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  api:
    build: ./app
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init-env.sh first}
      FIREBREAK_CHAOS_ENABLED: ${FIREBREAK_CHAOS_ENABLED:-false}
      OTEL_SERVICE_NAME: orders-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      # Stable HTTP conventions (http.server.request.duration in seconds);
      # without it the instrumentation emits the old millisecond metric.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      OTEL_PYTHON_EXCLUDED_URLS: "healthz,readyz,metrics"
    ports:
      - "127.0.0.1:8000:8000"
    # A ceiling makes capacity measurable; without it the API borrows the
    # whole machine and the breaking point means nothing.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      # The slim image has no curl.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.16.0
    deploy:
      resources:
        limits:
          # 75 MB now, 145 MB peak in 24 h
          memory: 512M
    # Setting "command" drops the image defaults, so the first two are repeated.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./platform/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.34.2
    deploy:
      resources:
        limits:
          # 14 MB measured
          memory: 128M
    volumes:
      - ./platform/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./platform/alertmanager/templates:/etc/alertmanager/templates:ro
      - ./platform/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanagerdata:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Only starts with --profile loadtest; see scripts/loadtest.sh.
  k6:
    image: grafana/k6:2.3.0
    deploy:
      resources:
        limits:
          # only runs for load tests
          memory: 512M
    profiles: [loadtest]
    volumes:
      - ./loadtests:/scripts:ro
    environment:
      BASE_URL: http://api:8000
    depends_on:
      - api

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    deploy:
      resources:
        limits:
          # 39 MB measured
          memory: 256M
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./platform/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  loki:
    image: grafana/loki:3.7.9
    deploy:
      resources:
        limits:
          # 79 MB measured; a wide query can spike
          memory: 384M
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./platform/loki/config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:3.1.1
    deploy:
      resources:
        limits:
          # 32 MB measured; compaction spikes
          memory: 384M
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./platform/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:13.3.0
    deploy:
      resources:
        limits:
          # 254 MB measured
          memory: 512M
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Required, so Grafana never starts with the default admin/admin.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - ./platform/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:0.40.13
    profiles: [automation]
    volumes:
      - ollama-models:/root/.ollama
    # No ports: only n8n talks to it, over the Compose network.
    deploy:
      resources:
        # The model lives in VRAM; this caps the RAM side (634 MB measured).
        limits:
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  n8n:
    image: n8nio/n8n:2.45.7
    deploy:
      resources:
        limits:
          # 461 MB measured
          memory: 1G
    profiles: [automation]
    environment:
      GENERIC_TIMEZONE: America/Costa_Rica
      TZ: America/Costa_Rica
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    # The volume also holds the key that encrypts saved credentials:
    # losing it means re-entering every credential.
    volumes:
      - n8n-data:/home/node/.n8n
    # Loopback only: the editor is reachable from this PC, not the home network.
    ports:
      - "127.0.0.1:5678:5678"
    networks: [default, docker-api]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Lets n8n restart containers without handing it the Docker socket, which
  # would be root on the host. Only the restart family of calls is allowed
  # (ALLOW_RESTARTS also covers stop and kill), and it lives on an internal
  # network shared with n8n alone. Never publish its port.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    deploy:
      resources:
        limits:
          # 37 MB measured
          memory: 128M
    profiles: [automation]
    # Required by the image to open the socket under AppArmor/SELinux.
    privileged: true
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

networks:
  docker-api:
    internal: true

volumes:
  pgdata:
  promdata:
  grafanadata:
  tempodata:
  lokidata:
  alertmanagerdata:
  ollama-models:
  n8n-data:
