version: "prometheus/v1"
service: "orders-api"
labels:
  owner: "firebreak"
  repo: "DBarrantes45/firebreak"
slos:
  - name: "requests-availability"
    objective: 99.9
    description: "99.9% of product and order requests succeed, measured over 30 days."
    sli:
      events:
        error_query: >-
          sum(rate(http_requests_total{
            job="orders-api", traffic="user", route=~"/products|/orders", status=~"5.."}[{{.window}}]))
        total_query: >-
          sum(rate(http_requests_total{job="orders-api", traffic="user", route=~"/products|/orders"}[{{.window}}]))
    alerting:
      name: OrdersApiHighErrorRate
      labels:
        category: "availability"
        service: "orders-api"
      annotations:
        summary: "orders-api is burning its availability error budget too fast."
        runbook_url: "https://github.com/DBarrantes45/firebreak/blob/main/runbooks/orders-api-high-error-rate.md"
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket

  - name: "requests-latency"
    objective: 99
    description: "99% of successful product and order requests answer within 250 ms, measured over 30 days."
    sli:
      events:
        # Slow = all successful requests minus the ones in the <= 250 ms bucket.
        error_query: >-
          (
            sum(rate(http_request_duration_seconds_count{
              job="orders-api", traffic="user", route=~"/products|/orders", status_class="2xx"}[{{.window}}]))
            -
            sum(rate(http_request_duration_seconds_bucket{
              job="orders-api", traffic="user", route=~"/products|/orders",
              status_class="2xx", le="0.25"}[{{.window}}]))
          )
        total_query: >-
          sum(rate(http_request_duration_seconds_count{
            job="orders-api", traffic="user", route=~"/products|/orders", status_class="2xx"}[{{.window}}]))
    alerting:
      name: OrdersApiHighLatency
      labels:
        category: "latency"
        service: "orders-api"
      annotations:
        summary: "orders-api is burning its latency error budget too fast."
        runbook_url: "https://github.com/DBarrantes45/firebreak/blob/main/runbooks/orders-api-high-latency.md"
      page_alert:
        labels:
          severity: page
      ticket_alert:
        labels:
          severity: ticket
