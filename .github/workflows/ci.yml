name: ci

# Run on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  # Same pre-commit hooks as on your machine: local and CI can't disagree.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - run: pytest -v

  compose-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CI has no .env; the example file gives Compose every variable it needs.
      - run: cp .env.example .env
      - name: Validate compose.yaml
        run: docker compose config --quiet
      - name: Build the api image
        run: docker build -t firebreak-api:ci app
      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            firebreak-api:ci

  # Configuration is code too: a broken prometheus.yml or dashboard JSON
  # fails here instead of at 2 a.m.
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check prometheus.yml with promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/platform/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
      - name: Check that every dashboard is valid JSON
        run: |
          for file in platform/grafana/dashboards/*.json; do
            python3 -m json.tool "$file" > /dev/null && echo "OK: $file"
          done

  # Starts the whole stack and checks that every piece answers and that
  # Prometheus is really scraping the API.
  smoke:
    runs-on: ubuntu-latest
    needs: [validate-config]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Start the stack and wait for every healthcheck
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: The API answers
        run: |
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/readyz
          curl -fsS localhost:8000/products
          curl -fsS localhost:8000/metrics | grep -q http_requests_total
      - name: Prometheus scrapes the API (target "up")
        run: |
          for attempt in $(seq 1 12); do
            health=$(curl -fsS localhost:9090/api/v1/targets \
              | jq -r '.data.activeTargets[] | select(.labels.job == "orders-api") | .health')
            echo "attempt $attempt: orders-api target is '$health'"
            if [ "$health" = "up" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Grafana loaded the data source and the dashboard
        run: |
          # Read the password from .env instead of writing it here:
          # gitleaks rightly flags credentials written inline in commands.
          source .env
          curl -fsS -u "admin:${GRAFANA_ADMIN_PASSWORD}" localhost:3000/api/datasources/uid/prometheus > /dev/null
          curl -fsS -u "admin:${GRAFANA_ADMIN_PASSWORD}" localhost:3000/api/dashboards/uid/golden-signals > /dev/null
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the scan looks at every commit, not only the last one.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
