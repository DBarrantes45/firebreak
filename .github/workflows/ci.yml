name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run for the commit it replaced.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Graph: lint, secrets, test and validate-config run in parallel; the image is
# built once only if the first three pass, then scan and e2e reuse it.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure

  # The pre-commit hook only sees today's files; this scans every commit,
  # because a secret deleted later is still public in the history.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - run: pytest -v

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # CI has no .env.
      - run: cp .env.example .env
      - name: Validate compose.yaml, including the automation profile
        run: |
          docker compose config --quiet
          docker compose --profile automation config --quiet
      - name: Check prometheus.yml with promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/platform/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
      - name: Validate the OpenTelemetry Collector config
        run: |
          docker run --rm \
            -v "$PWD/platform/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.163.2 validate --config=/etc/otelcol/config.yaml
      - name: Generated SLO rules are up to date
        run: |
          scripts/generate-slo-rules.sh
          git diff --exit-code platform/prometheus/rules/ \
            || { echo "Rules are stale: run scripts/generate-slo-rules.sh and commit"; exit 1; }
      - name: Check the alerting and recording rules with promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/platform/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check rules \
            /etc/prometheus/rules/slo-orders-api.yml /etc/prometheus/rules/orders-api.yml
      - name: Unit tests for the alerting rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/platform/prometheus:/etc/prometheus:ro" -w /etc/prometheus/tests \
            prom/prometheus:v3.15.1 test rules alerts.test.yml
      - name: Check the Alertmanager config with amtool
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/platform/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Check that every dashboard and n8n workflow is valid JSON
        run: |
          for file in platform/grafana/dashboards/*.json automation/n8n/*.json; do
            python3 -m json.tool "$file" > /dev/null && echo "OK: $file"
          done

  build:
    needs: [lint, test, validate-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Built once and handed to the next jobs as a file: a PR's image is
      # never pushed to a registry.
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: app
          # The name Compose gives the api image, so e2e can skip the build.
          tags: firebreak-api:latest
          outputs: type=docker,dest=${{ runner.temp }}/api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}/api-image.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}
      - run: docker load --input "${{ runner.temp }}/api-image.tar"
      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            firebreak-api:latest

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: api-image
          path: ${{ runner.temp }}
      - run: docker load --input "${{ runner.temp }}/api-image.tar"
      - run: cp .env.example .env
      - name: Start the stack with the built image and wait for every healthcheck
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Run the smoke test
        run: scripts/smoke-test.sh
      - name: An outage reaches Alertmanager
        run: scripts/e2e-alert.sh
      - name: Load smoke test (k6 thresholds are the gate)
        run: scripts/loadtest.sh smoke
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
